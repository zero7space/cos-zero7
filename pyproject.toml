[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "venv", "__pycache__", "node_modules"]
markers = [
    "unit",
    "integration",
    "slow",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
